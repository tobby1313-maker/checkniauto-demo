[mypy]
python_version = 3.11
files = scrapper_demo/contracts.py, scrapper_demo/logging.py, scrapper_demo/verdicts.py, scrapper_demo/providers/retry.py, scrapper_demo/services/analysis_pipeline.py, scrapper_demo/calibration.py, scrapper_demo/calibration_cli.py, risk_scorer.py, risk_scorer_v2.py
check_untyped_defs = True
disallow_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
ignore_missing_imports = True

[mypy-scrapper_demo.services.analysis_pipeline]
disallow_untyped_defs = False
