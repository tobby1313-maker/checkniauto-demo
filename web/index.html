<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Checkni Auto je AI kontrola inzerátu auta pred kúpou.">
    <title>Checkni Auto - AI kontrola auta pred kúpou</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --bg: #ffffff;
            --surface: #ffffff;
            --surface-soft: #f3f4f6;
            --text: #121820;
            --muted: #66717f;
            --line: #e1e5ea;
            --orange: #f97316;
            --orange-dark: #ea580c;
            --orange-soft: rgba(249, 115, 22, 0.14);
            --logo-filter: invert(57%) sepia(92%) saturate(1962%) hue-rotate(351deg) brightness(99%) contrast(97%);
            --success: #0f766e;
            --danger: #b42318;
            --shadow: 0 22px 60px rgba(18, 24, 32, 0.08);
            --focus: 0 0 0 4px rgba(249, 115, 22, 0.20);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #111315;
            --surface: #1a1d21;
            --surface-soft: #24282d;
            --text: #f4f4f5;
            --muted: #a8adb5;
            --line: #333840;
            --orange: #f97316;
            --orange-dark: #fb923c;
            --orange-soft: rgba(249, 115, 22, 0.18);
            --logo-filter: invert(57%) sepia(92%) saturate(1962%) hue-rotate(351deg) brightness(105%) contrast(98%);
            --success: #4fd1c5;
            --danger: #ff8a80;
            --shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
            --focus: 0 0 0 4px rgba(249, 115, 22, 0.25);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-width: 320px;
            background: var(--bg);
            color: var(--text);
        }
        button, input, textarea, select { font: inherit; }
        button { cursor: pointer; }
        img { max-width: 100%; display: block; }

        .page {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: color-mix(in srgb, var(--surface) 88%, transparent);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(16px);
        }

        .nav {
            max-width: 1120px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .brand img {
            width: 46px;
            height: 46px;
            object-fit: contain;
            border-radius: 0;
            filter: var(--logo-filter);
        }

        :root[data-theme="dark"] .brand img {
            filter: var(--logo-filter);
        }

        .brand strong {
            display: block;
            font-size: 18px;
            line-height: 1.1;
            letter-spacing: 0;
        }

        .brand span {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin-top: 2px;
        }
        .brand:focus-visible {
            outline: 2px solid var(--orange);
            outline-offset: 6px;
            border-radius: 14px;
        }

        .nav-tools {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .language-select,
        input,
        textarea,
        select {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            outline: none;
        }

        .language-select {
            min-height: 40px;
            padding: 0 36px 0 12px;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px 12px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--orange);
            box-shadow: var(--focus);
        }

        .theme-toggle {
            width: 76px;
            min-width: 76px;
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface-soft);
            color: var(--muted);
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            padding: 3px;
            position: relative;
        }

        .theme-toggle::before {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 32px;
            height: 32px;
            border-radius: 999px;
            background: var(--surface);
            box-shadow: 0 2px 8px rgba(18, 24, 32, 0.14);
            transition: transform 180ms ease;
        }

        :root[data-theme="dark"] .theme-toggle::before {
            transform: translateX(36px);
        }

        .theme-toggle svg {
            width: 17px;
            height: 17px;
            justify-self: center;
            z-index: 1;
        }

        .layout {
            max-width: 1120px;
            width: 100%;
            margin: 0 auto;
            padding: 36px 20px 42px;
            display: grid;
            grid-template-columns: minmax(320px, 620px);
            gap: 22px;
            align-items: start;
            justify-content: center;
        }

        h1 {
            margin: 0;
            max-width: 480px;
            font-size: clamp(42px, 7vw, 76px);
            line-height: 0.96;
            letter-spacing: 0;
        }

        .analyzer,
        .log-panel {
            background: color-mix(in srgb, var(--surface) 96%, transparent);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .analyzer-head,
        .panel-head {
            padding: 15px 16px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .analyzer-head strong,
        .panel-head strong {
            font-size: 17px;
        }

        .status {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.35;
            text-align: right;
        }

        .status.error {
            color: var(--danger);
            font-weight: 700;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 4px;
            margin: 16px 16px 0;
            background: var(--surface-soft);
            border-radius: 8px;
        }

        .tab {
            min-height: 42px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            font-weight: 700;
        }

        .tab.active {
            background: var(--surface);
            color: var(--orange);
            box-shadow: inset 0 0 0 1px var(--orange-soft), 0 1px 4px rgba(18, 24, 32, 0.10);
        }

        form {
            padding: 16px;
        }

        .field {
            display: grid;
            gap: 7px;
            margin-bottom: 13px;
        }

        .field label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .hint {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.4;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        textarea {
            min-height: 168px;
            resize: vertical;
            line-height: 1.5;
        }

        .btn {
            border: 1px solid var(--line);
            border-radius: 8px;
            min-height: 42px;
            padding: 10px 13px;
            background: var(--surface);
            color: var(--text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
        }

        .btn.primary {
            width: 100%;
            border-color: var(--orange);
            background: var(--orange);
            color: #fff;
            font-size: 16px;
        }

        .btn.primary:hover {
            background: var(--orange-dark);
            border-color: var(--orange-dark);
        }

        .btn:disabled {
            opacity: 0.52;
            cursor: not-allowed;
        }

        .hidden { display: none; }

        input[type="file"]::file-selector-button {
            border: 0;
            border-radius: 7px;
            min-height: 36px;
            margin-right: 12px;
            padding: 8px 12px;
            background: var(--orange);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--orange-dark);
        }

        .workspace {
            max-width: 1120px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 42px;
        }

        .log {
            min-height: 260px;
            max-height: 70vh;
            overflow: auto;
            margin: 0;
            padding: 14px 16px;
            background: var(--surface);
            color: var(--text);
            white-space: pre-wrap;
            font: 14px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
        }

        :root[data-theme="dark"] .log {
            background: var(--surface);
            color: var(--text);
        }

        /* ========== Progress Overlay ========== */
        #progressOverlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
            pointer-events: none;
        }

        #progressOverlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        #progressOverlay .backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        #progressOverlay .modal {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 28px 32px 20px;
            max-width: 400px;
            width: 92%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            text-align: center;
            pointer-events: auto;
        }

        #progressOverlay .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text);
        }

        .road-wrap {
            position: relative;
            height: 56px;
            margin: 0 8px 12px;
            overflow: visible;
        }

        .road-surface {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 28px;
            background: #3d4a5c;
            border-radius: 6px;
            transform: translateY(-50%);
            overflow: hidden;
        }

        .road-curbs {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: #a0aec0;
            border-radius: 2px;
        }

        .road-curbs.top { top: 2px; }
        .road-curbs.bottom { bottom: 2px; }

        .road-marks {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: repeating-linear-gradient(
                90deg,
                #f7fafc 0px,
                #f7fafc 16px,
                transparent 16px,
                transparent 32px
            );
            transform: translateY(-50%);
        }

        .road-car {
            position: absolute;
            top: 50%;
            font-size: 28px;
            line-height: 1;
            transform: translate(-50%, -50%) scaleX(-1);
            left: 0%;
            transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 5;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
        }

        .road-finish {
            position: absolute;
            right: -8px;
            top: 50%;
            font-size: 26px;
            line-height: 1;
            transform: translateY(-50%);
            z-index: 2;
        }

        .progress-track {
            height: 5px;
            background: var(--surface-soft);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-track-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--orange), var(--orange-dark));
            border-radius: 4px;
            transition: width 0.45s ease;
            width: 0%;
        }

        .progress-pct {
            font-size: 14px;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .overlay-cancel {
            border: 1px solid var(--line);
            border-radius: 8px;
            min-height: 36px;
            padding: 7px 18px;
            background: transparent;
            color: var(--muted);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .overlay-cancel:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn.small {
            min-height: 34px;
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn.ghost {
            background: transparent;
            border-color: var(--line);
            color: var(--muted);
        }

        .btn.ghost:hover {
            border-color: var(--orange);
            color: var(--orange);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        @media (max-width: 920px) {
            .layout,
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 620px) {
            .nav {
                align-items: flex-start;
                flex-direction: column;
            }

            .nav-tools {
                width: 100%;
                justify-content: space-between;
            }

            .nav-actions {
                width: 100%;
            }

            .nav-actions .btn {
                flex: 1;
            }

            .language-select {
                flex: 1;
                min-width: 0;
            }

            .layout,
            .workspace {
                padding-left: 14px;
                padding-right: 14px;
            }

            .row {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 43px;
            }

            .panel-head {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="page" id="page">
        <header class="topbar">
            <nav class="nav">
                <button class="brand" id="brandHomeBtn" type="button" aria-label="Return to landing page">
                    <img src="assets/checkni-auto-logo.png" alt="Checkni Auto logo">
                    <div>
                        <strong>Checkni Auto</strong>
                        <span id="brandSubtitle">Vlož inzerát alebo vlastný text s fotkami. Dostaneš stručnú analýzu rizík, ceny a otázok pre predajcu.</span>
                    </div>
                </button>

                <div class="nav-tools">
                    <div class="nav-actions">
                        <button class="btn ghost small" id="newAnalysisBtn" type="button">Nová analýza</button>
                        <button class="btn ghost small" id="dashboardBtn" type="button">Dashboard</button>
                    </div>
                    <select id="outputLanguage" class="language-select" aria-label="Jazyk výstupu">
                        <option value="sk">Slovenčina</option>
                        <option value="en">English</option>
                    </select>
                    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Prepnúť svetlý alebo tmavý režim" title="Prepnúť tému">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"></circle>
                            <path d="M12 2v3M12 19v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M2 12h3M19 12h3M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                        </svg>
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5 8.5 8.5 0 1 0 20.5 14.3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                </div>
            </nav>
        </header>

        <main>
            <section class="layout">
                <section class="analyzer" id="analyzerSection" aria-label="Analyzátor inzerátu">
                    <div class="analyzer-head">
                        <strong id="analyzerTitle">Analyzovať inzerát</strong>
                    </div>

                    <div class="tabs" role="tablist">
                        <button class="tab active" id="urlTab" type="button">URL</button>
                        <button class="tab" id="manualTab" type="button">Manuálne</button>
                    </div>

                    <form id="urlForm">
                        <div class="field">
                            <label for="listingUrl">Odkaz na inzerát</label>
                            <input id="listingUrl" name="url" type="url" placeholder="https://www.bazos.sk/..." autocomplete="url">
                            <div class="hint" id="supportedHint">Podporované: autobazar.eu, autobazar.sk, bazos.sk, bazos.cz.</div>
                        </div>
                        <button class="btn primary" id="urlSubmit" type="submit">Analyzovať</button>
                    </form>

                    <form id="manualForm" class="hidden">
                        <div class="field">
                            <label for="title">Názov auta</label>
                            <input id="title" name="title" placeholder="Škoda Octavia 2.0 TDI">
                        </div>
                        <div class="row">
                            <div class="field">
                                <label for="price">Cena v EUR</label>
                                <input id="price" name="price" inputmode="numeric" placeholder="12900">
                            </div>
                            <div class="field">
                                <label for="sourceUrl">Zdrojový odkaz</label>
                                <input id="sourceUrl" name="source_url" type="url" placeholder="Voliteľné">
                            </div>
                        </div>
                        <div class="field">
                            <label for="manualText">Text inzerátu</label>
                            <textarea id="manualText" name="manual_text" placeholder="Vlož popis, parametre, VIN, výbavu, servisnú históriu a poznámku predajcu..."></textarea>
                        </div>
                        <div class="field">
                            <label for="images">Fotky</label>
                            <input id="images" name="images" type="file" accept="image/*" multiple>
                            <div class="hint" id="imagesHint">Maximálne 12 fotiek.</div>
                        </div>
                        <button class="btn primary" id="manualSubmit" type="submit">Analyzovať</button>
                    </form>
                </section>
            </section>

            <section class="workspace hidden" id="analysis">
                <aside class="log-panel">
                    <div class="panel-head">
                        <strong>Výsledok</strong>
                        <span class="status" id="status">Pripravené</span>
                    </div>
                    <div class="log" id="log">Výsledok analýzy sa zobrazí tu.</div>
                </aside>
            </section>
        </main>
    </div>

    <!-- Progress Overlay -->
    <div id="progressOverlay">
        <div class="backdrop"></div>
        <div class="modal">
            <div class="modal-title" id="overlayTitle">🏎️ Analýza v priebehu</div>
            <div class="road-wrap">
                <div class="road-surface">
                    <div class="road-curbs top"></div>
                    <div class="road-marks"></div>
                    <div class="road-curbs bottom"></div>
                </div>
                <div class="road-finish">🏁</div>
                <div class="road-car" id="overlayCar">🚗</div>
            </div>
            <div class="progress-track">
                <div class="progress-track-fill" id="overlayProgressFill"></div>
            </div>
            <div class="progress-pct" id="overlayProgressPct">0%</div>
            <button class="overlay-cancel" id="overlayCancelBtn">Zrušiť</button>
        </div>
    </div>

                themeLabel: "Switch light or dark mode",
                themeTitle: "Switch theme",
                analyzerLabel: "Listing analyzer"
            }
        };

        function tr(key) {
            const val = translations[currentLanguage]?.[key] || translations.sk[key];
            return val !== undefined ? val : key;
        }

        function setText(selector, value) {
            const node = document.querySelector(selector);
            if (node) node.textContent = value;
        }

        function applyLanguage(language) {
            currentLanguage = language === "en" ? "en" : "sk";
            outputLanguage.value = currentLanguage;
            document.documentElement.lang = currentLanguage;
            document.title = tr("documentTitle");
            localStorage.setItem("checkni-auto-language", currentLanguage);

            outputLanguage.setAttribute("aria-label", tr("languageLabel"));
            themeToggle.setAttribute("aria-label", tr("themeLabel"));
            themeToggle.setAttribute("title", tr("themeTitle"));
            document.querySelector("#analyzerSection").setAttribute("aria-label", tr("analyzerLabel"));

            setText("#brandSubtitle", tr("brandSubtitle"));
            setText("#analyzerTitle", tr("analyzerTitle"));
            setText("#manualTab", tr("manualTab"));
            setText("label[for='listingUrl']", tr("listingUrlLabel"));
            setText("#supportedHint", tr("supportedHint"));
            setText("#urlSubmit", tr("urlSubmit"));
            setText("label[for='title']", tr("titleLabel"));
            setText("label[for='price']", tr("priceLabel"));
            setText("label[for='sourceUrl']", tr("sourceUrlLabel"));
            setText("label[for='manualText']", tr("manualTextLabel"));
            setText("label[for='images']", tr("imagesLabel"));
            setText("#imagesHint", tr("imagesHint"));
            setText("#manualSubmit", tr("manualSubmit"));
            setText(".log-panel .panel-head strong", tr("progressTitle"));
            setText("#newAnalysisBtn", tr("newAnalysis"));
            setText("#dashboardBtn", tr("dashboard"));

            document.querySelector("#title").placeholder = tr("titlePlaceholder");
            document.querySelector("#sourceUrl").placeholder = tr("sourceUrlPlaceholder");
            document.querySelector("#manualText").placeholder = tr("manualTextPlaceholder");

            if (!latestResultText && !logEl.textContent.trim()) {
                statusEl.textContent = tr("ready");
                logEl.textContent = tr("resultEmpty");
            }
        }

        function resetForms() {
            urlForm.reset();
            manualForm.reset();
            setMode("url");
        }

        function resetWorkspace() {
            latestResultText = "";
            analysisSection.classList.add("hidden");
            logEl.textContent = tr("resultEmpty");
            statusEl.textContent = tr("ready");
            statusEl.classList.remove("error");
        }

        function resetToLandingState() {
            if (abortController) {
                abortController.abort();
                hideOverlay();
            }
            resetWorkspace();
            resetForms();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function initialTheme() {
            const saved = localStorage.getItem("checkni-auto-theme");
            if (saved === "dark" || saved === "light") return saved;
            return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }

        function setTheme(theme) {
            root.dataset.theme = theme;
            localStorage.setItem("checkni-auto-theme", theme);
        }

        function setMode(mode) {
            const manual = mode === "manual";
            manualForm.classList.toggle("hidden", !manual);
            urlForm.classList.toggle("hidden", manual);
            manualTab.classList.toggle("active", manual);
            urlTab.classList.toggle("active", !manual);
        }

        function resetOutput() {
            analysisSection.classList.remove("hidden");
            logEl.textContent = "";
            statusEl.textContent = tr("starting");
            statusEl.classList.remove("error");
            analysisSection.scrollIntoView({ behavior: "smooth", block: "start" });
            showOverlay();
        }

        function setBusy(isBusy) {
            submitButtons.forEach((button) => button.disabled = isBusy);
        }

        let fakeProgressTimer = null;
        let isRealUpdateInProgress = false;

        function showOverlay() {
            const overlay = document.getElementById('progressOverlay');
            document.getElementById('overlayCancelBtn').disabled = false;
            document.getElementById('overlayCar').style.left = '0%';
            document.getElementById('overlayProgressFill').style.width = '0%';
            document.getElementById('overlayProgressPct').textContent = '0%';
            overlay.classList.add('active');
            abortController = new AbortController();
            startFakeProgress();
        }

        function hideOverlay() {
            const overlay = document.getElementById('progressOverlay');
            overlay.classList.remove('active');
            abortController = null;
            stopFakeProgress();
        }

        function stopFakeProgress() {
            if (fakeProgressTimer) {
                clearInterval(fakeProgressTimer);
                fakeProgressTimer = null;
            }
        }

        function startFakeProgress() {
            stopFakeProgress();
            fakeProgressTimer = setInterval(() => {
                if (isRealUpdateInProgress) return;
                const car = document.getElementById('overlayCar');
                const currentLeft = parseFloat(car.style.left) || 0;
                if (currentLeft < 92) {
                    const increment = 0.5 + Math.random() * 1.8;
                    const newPct = Math.min(92, currentLeft + increment);
                    setPosition(newPct);
                }
            }, 1000);
        }

        function setPosition(pct) {
            const p = Math.min(100, Math.max(0, pct));
            document.getElementById('overlayCar').style.left = p + '%';
            document.getElementById('overlayProgressFill').style.width = p + '%';
            document.getElementById('overlayProgressPct').textContent = Math.round(p) + '%';
        }

        function finishRealUpdate() {
            isRealUpdateInProgress = false;
            startFakeProgress();
        }

        function updateProgress(percent) {
            isRealUpdateInProgress = true;
            stopFakeProgress();

            const p = Math.min(100, Math.max(0, percent));
            const car = document.getElementById('overlayCar');
            const currentLeft = parseFloat(car.style.left) || 0;

            if (p <= currentLeft + 1) {
                finishRealUpdate();
                return;
            }

            const steps = [0, 25, 50, 75, 93].filter(cp => cp > currentLeft + 0.5 && cp < p);

            if (steps.length > 0) {
                let idx = 0;
                const goNext = () => {
                    setPosition(steps[idx]);
                    idx++;
                    if (idx < steps.length) {
                        setTimeout(goNext, 600);
                    } else if (p > steps[steps.length - 1]) {
                        setTimeout(() => { setPosition(p); finishRealUpdate(); }, 600);
                    } else {
                        finishRealUpdate();
                    }
                };
                setTimeout(goNext, 600);
            } else {
                setPosition(p);
                finishRealUpdate();
            }
        }

        function getProgressForStatus(status) {
            const s = (status || '').toLowerCase();
            if (s.includes('start') || s.includes('spúšťam') || s.includes('priprav')) return 5;
            if (s.includes('download') || s.includes('sťahujem') || s.includes('načítavam')) return 15;
            if (s.includes('fotk') || s.includes('image') || s.includes('photo') || s.includes('obráz') || s.includes('spracúvam') || s.includes('process')) return 30;
            if (s.includes('analyz') || s.includes('vyhodnoc') || s.includes('check') || s.includes('scrape') || s.includes('skenujem')) return 55;
            if (s.includes('gener') || s.includes('vytvára') || s.includes('render') || s.includes('výsled') || s.includes('format')) return 80;
            if (s.includes('hotovo') || s.includes('done') || s.includes('dokončen') || s.includes('komplet') || s.includes('finished')) return 100;
            return null;
        }

        function appendLog(line) {
            analysisSection.classList.remove("hidden");
            // Replace initial placeholder text
            if (logEl.textContent === tr("resultEmpty")) {
                logEl.textContent = "";
            }
            logEl.textContent += line + '\n';
            logEl.scrollTop = logEl.scrollHeight;
        }

        function showResult(text) {
            analysisSection.classList.remove("hidden");
            latestResultText = text || "";
            if (logEl.textContent === tr("resultEmpty") || logEl.textContent.trim() === "") {
                logEl.textContent = latestResultText;
            } else {
                logEl.textContent = latestResultText;
            }
            logEl.style.whiteSpace = 'pre-wrap';
            logEl.scrollTop = 0;
            statusEl.textContent = tr("finish");
            statusEl.classList.remove("error");
        }

        function enforceImageLimit() {
            if (!imagesInput.files || imagesInput.files.length <= maxManualImages) return true;

            const selected = Array.from(imagesInput.files).slice(0, maxManualImages);
            try {
                const transfer = new DataTransfer();
                selected.forEach((file) => transfer.items.add(file));
                imagesInput.files = transfer.files;
            } catch (error) {
                imagesInput.value = '';
            }

            statusEl.textContent = tr('tooManyImages');
            statusEl.classList.add('error');
            return false;
        }

        async function readSse(response) {
            if (!response.ok) {
                const errorBody = await response.json().catch(() => ({}));
                throw new Error(errorBody.error || 'Request failed (' + response.status + ')');
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let net = '';
            let sawDoneSignal = false;
            let fullResult = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                net += decoder.decode(value, { stream: true });
                const events = net.split('\n\n');
                net = events.pop() || '';

                for (const event of events) {
                    const line = event.split('\n').find((item) => item.startsWith('data: '));
                    if (!line) continue;
                    const payload = line.slice(6);
                    if (payload === '[DONE]') {
                        sawDoneSignal = true;
                        showResult(fullResult);
                        updateProgress(100);
                        setTimeout(() => {
                            hideOverlay();
                        }, 600);
                        return;
                    }
                    const data = JSON.parse(payload);
                    if (data.error) throw new Error(data.error);
                    if (data.status) {
                        statusEl.textContent = data.status;
                        const p = getProgressForStatus(data.status);
                        if (p !== null) updateProgress(p);
                    }
                    if (data.text) {
                        fullResult += data.text;
                    }
                }
            }

            if (!sawDoneSignal) {
                if (fullResult) {
                    showResult(fullResult);
                    updateProgress(100);
                    setTimeout(() => { hideOverlay(); }, 600);
                    return;
                }
                throw new Error('Connection ended before the analysis finished. Try again with fewer photos or use manual mode.');
            }
        }

        async function runUrl(event) {
            event.preventDefault();
            resetOutput();
            setBusy(true);

            try {
                const response = await fetch('/api/demo/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    signal: abortController?.signal,
                    body: JSON.stringify({
                        url: document.querySelector('#listingUrl').value,
                        output_language: outputLanguage.value
                    })
                });
                await readSse(response);
            } catch (error) {
                if (error.name === 'AbortError') {
                    statusEl.textContent = 'Zrušené';
                    appendLog('Analysis cancelled');
                    return;
                }
                statusEl.textContent = error.message;
                statusEl.classList.add('error');
                appendLog('ERROR: ' + error.message);
                if (/manual/i.test(error.message)) {
                    document.querySelector('#sourceUrl').value = document.querySelector('#listingUrl').value;
                    setMode('manual');
                }
            } finally {
                setBusy(false);
                hideOverlay();
            }
        }

        async function runManual(event) {
            event.preventDefault();
            if (!enforceImageLimit()) return;
            resetOutput();
            setBusy(true);

            try {
                const formData = new FormData(manualForm);
                formData.set('output_language', outputLanguage.value);
                const response = await fetch('/api/demo/analyze-manual', {
                    method: 'POST',
                    signal: abortController?.signal,
                    body: formData
                });
                await readSse(response);
            } catch (error) {
                if (error.name === 'AbortError') {
                    statusEl.textContent = 'Zrušené';
                    appendLog('Analysis cancelled');
                    return;
                }
                statusEl.textContent = error.message;
                statusEl.classList.add('error');
                appendLog('ERROR: ' + error.message);
            } finally {
                setBusy(false);
                hideOverlay();
            }
        }

        themeToggle.addEventListener('click', () => {
            setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
        });

        newAnalysisBtn.addEventListener('click', resetToLandingState);
        dashboardBtn.addEventListener('click', () => {
            window.open('/token-dashboard.html', '_blank');
        });

        document.getElementById('overlayCancelBtn').addEventListener('click', () => {
            if (abortController) {
                document.getElementById('overlayCancelBtn').disabled = true;
                abortController.abort();
            }
        });

        urlTab.addEventListener('click', () => setMode('url'));
        manualTab.addEventListener('click', () => setMode('manual'));
        brandHomeBtn.addEventListener('click', resetToLandingState);
        outputLanguage.addEventListener('change', () => applyLanguage(outputLanguage.value));
        imagesInput.addEventListener('change', enforceImageLimit);

        urlForm.addEventListener('submit', runUrl);
        manualForm.addEventListener('submit', runManual);

        applyLanguage(localStorage.getItem('checkni-auto-language') || outputLanguage.value);
        setTheme(initialTheme());
    </script>
</body>
</html>
