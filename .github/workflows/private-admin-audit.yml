name: Temporary private admin audit

on:
  push:
    branches: [v2]
    paths:
      - ".github/workflows/private-admin-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_TOKEN: ${{ secrets.ADMIN_DASHBOARD_TOKEN || secrets.CHECKNIAUTO_ADMIN_TOKEN || secrets.DEMO_ADMIN_TOKEN }}
    steps:
      - name: Fetch protected dashboard diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_TOKEN"
          echo "::add-mask::$ADMIN_TOKEN"
          mkdir -p audit/artifacts secure
          base="https://checkniauto.onrender.com"
          slug="predam-chrysler-300c-35-v6-2006-lpg"
          cookie_jar="secure/cookies.txt"

          curl --silent --show-error --location \
            --cookie-jar "$cookie_jar" --cookie "$cookie_jar" \
            --data-urlencode "token=$ADMIN_TOKEN" \
            --output audit/login-result.html \
            --write-out '%{http_code}\n' \
            "$base/admin/login" > audit/login-status.txt
          grep -q "Token Usage" audit/login-result.html

          fetch() {
            local output="$1"
            local url="$2"
            curl --silent --show-error --location \
              --cookie-jar "$cookie_jar" --cookie "$cookie_jar" \
              --connect-timeout 20 --max-time 240 \
              --dump-header "audit/${output}.headers.txt" \
              --output "audit/${output}" \
              --write-out '%{http_code}\n' \
              "$url" > "audit/${output}.status.txt"
          }

          fetch token-usage.json "$base/api/token-usage?limit=250"
          fetch admin-listings.json "$base/api/admin/listings"
          fetch target-artifacts.json "$base/api/admin/listings/$slug/artifacts"
          fetch target-debugging-bundle.zip "$base/api/admin/debugging-bundles/$slug"
          fetch target-calibration-bundle.zip "$base/api/admin/calibration-bundles/$slug"
          fetch target-public-presentation.json "$base/api/demo/listings/$slug/presentation"
          fetch target-public-detail.json "$base/api/demo/listings/$slug"

          if [ "$(cat audit/target-artifacts.json.status.txt)" = "200" ]; then
            python - <<'PY'
          from pathlib import Path
          import json

          payload = json.loads(Path("audit/target-artifacts.json").read_text(encoding="utf-8"))
          rows = []
          for item in payload.get("artifacts") or []:
              filename = str(item.get("filename") or "artifact")
              url = str(item.get("url") or "")
              if url:
                  rows.append((filename, url))
          Path("secure/artifact-urls.tsv").write_text(
              "".join(f"{name}\t{url}\n" for name, url in rows), encoding="utf-8"
          )
          PY
            while IFS=$'\t' read -r filename url; do
              [ -n "$url" ] || continue
              safe_name="$(printf '%s' "$filename" | tr -c 'A-Za-z0-9._-' '_')"
              case "$url" in
                http://*|https://*) full_url="$url" ;;
                *) full_url="$base$url" ;;
              esac
              curl --silent --show-error --location \
                --cookie-jar "$cookie_jar" --cookie "$cookie_jar" \
                --connect-timeout 20 --max-time 240 \
                --output "audit/artifacts/$safe_name" \
                "$full_url"
            done < secure/artifact-urls.tsv
          fi

          python - <<'PY'
          from pathlib import Path
          import json

          audit = Path("audit")
          summary = {}
          for status_file in sorted(audit.glob("*.status.txt")):
              summary[status_file.name.removesuffix(".status.txt")] = status_file.read_text().strip()
          for name in ("token-usage.json", "admin-listings.json", "target-artifacts.json"):
              path = audit / name
              if not path.exists():
                  continue
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if name == "token-usage.json" and isinstance(data, dict):
                  summary["usage_totals"] = data.get("totals")
                  summary["usage_today"] = data.get("today")
                  summary["usage_recent_count"] = len(data.get("recent") or [])
              elif name == "admin-listings.json" and isinstance(data, list):
                  summary["admin_listing_count"] = len(data)
                  summary["admin_listing_slugs"] = [item.get("slug") for item in data[:20] if isinstance(item, dict)]
              elif name == "target-artifacts.json" and isinstance(data, dict):
                  summary["target_artifact_count"] = len(data.get("artifacts") or [])
          (audit / "audit-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

      - name: Upload private audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkniauto-private-admin-audit
          path: audit
          if-no-files-found: warn
          retention-days: 1
