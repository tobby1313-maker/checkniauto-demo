name: Temporary V2 source snapshot

on:
  push:
    branches: [v2]
    paths:
      - ".github/workflows/live-analysis-audit.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot
          git ls-files -z | tar --null -T - -czf snapshot/checkniauto-v2-source.tar.gz
          git rev-parse HEAD > snapshot/commit.txt
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: checkniauto-v2-source-snapshot
          path: snapshot
          if-no-files-found: error
          retention-days: 1
