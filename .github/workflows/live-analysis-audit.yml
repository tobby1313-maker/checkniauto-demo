name: Temporary live storage audit

on:
  push:
    branches: [v2]
    paths:
      - ".github/workflows/live-analysis-audit.yml"

permissions:
  contents: read

jobs:
  fetch-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch live health and listing state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          base="https://checkniauto.onrender.com"
          slug="predam-chrysler-300c-35-v6-2006-lpg"
          for item in \
            "healthz:$base/healthz" \
            "listings:$base/api/demo/listings" \
            "presentation:$base/api/demo/listings/$slug/presentation"; do
            name="${item%%:*}"
            url="${item#*:}"
            curl --silent --show-error --location --retry 4 --retry-all-errors \
              --connect-timeout 20 --max-time 180 \
              --dump-header "audit/${name}-headers.txt" \
              --output "audit/${name}.txt" \
              --write-out '%{http_code}\n' "$url" > "audit/${name}-status.txt"
            printf '%s status=' "$name"
            cat "audit/${name}-status.txt"
            printf '%s body=' "$name"
            cat "audit/${name}.txt"
            printf '\n'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: checkniauto-live-storage-audit
          path: audit
          retention-days: 1
