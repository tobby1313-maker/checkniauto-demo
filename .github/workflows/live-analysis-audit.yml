                  ) -> "DemoServerConfig":
                      values = os.environ if environ is None else environ
                      resolved_script_dir = str(Path(script_dir).resolve())
                      explicit_data_dir = str(values.get("SCRAPPER_DATA_DIR") or "").strip()
                      data_dir = explicit_data_dir or os.path.join(
