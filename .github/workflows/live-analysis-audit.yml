name: Temporary live analysis audit

on:
  push:
    branches: [v2]
    paths:
      - ".github/workflows/live-analysis-audit.yml"

permissions:
  contents: read

jobs:
  fetch-source-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt
      - name: Scrape the original Bazos listing
        shell: bash
        env:
          SCRAPPER_AUTA_DIR: ${{ github.workspace }}/audit/scraped
          DEMO_MAX_SCRAPED_IMAGES: "0"
          DEMO_IMAGE_REQUEST_TIMEOUT: "20"
        run: |
          set -euo pipefail
          mkdir -p audit
          python Bazos.py "https://auto.bazos.sk/inzerat/194509993/predam-chrysler-300c-35-v6-2006-lpg.php" \
            > audit/scraper-output.txt 2>&1
          find audit -type f -printf '%P %s bytes\n' | sort > audit/file-list.txt
          python - <<'PY'
          from pathlib import Path
          import json

          files = list(Path("audit/scraped").glob("*/raw_data.json"))
          if not files:
              raise SystemExit("raw_data.json not produced")
          data = json.loads(files[0].read_text(encoding="utf-8"))
          summary = {
              "title": data.get("title"),
              "price": data.get("price"),
              "currency": data.get("currency"),
              "vin": data.get("vin"),
              "description": data.get("description"),
              "parameters": data.get("parameters"),
              "photos_count": data.get("photos_count"),
              "source": data.get("source"),
          }
          Path("audit/source-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
      - name: Upload source listing audit
        uses: actions/upload-artifact@v4
        with:
          name: chrysler-source-listing-audit
          path: audit
          if-no-files-found: error
          retention-days: 1
