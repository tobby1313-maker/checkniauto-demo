                  @property
                  def max_upload_bytes(self) -> int:
                      return self.demo_max_upload_mb * 1024 * 1024

                  def as_flask_mapping(self) -> dict[str, object]:
                      return {
                          "SECRET_KEY": self.flask_secret_key,
                          "MAX_CONTENT_LENGTH": self.max_upload_bytes,
                          "DEMO_MODE": self.demo_mode,
                          "DEMO_PROMPT_FILE": self.demo_prompt_file,
                          "DEMO_RATE_LIMIT_PER_IP": self.demo_rate_limit_per_ip,
                          "DEMO_MAX_CONCURRENT_JOBS": self.demo_max_concurrent_jobs,
                          "DEMO_JOB_TTL_MINUTES": self.demo_job_ttl_minutes,
                          "DEMO_MAX_MANUAL_IMAGES": self.demo_max_manual_images,
                          "DEMO_MAX_SCRAPED_IMAGES": self.demo_max_scraped_images,
                          "DEMO_SKIP_KB": self.demo_skip_kb,
                          "DEMO_ANALYSIS_PROFILE": self.demo_analysis_profile,
                          "DEMO_MAX_UPLOAD_MB": self.demo_max_upload_mb,
                          "SCRAPPER_DATA_DIR": self.data_dir,
                          "SCRAPPER_AUTA_DIR": self.auta_dir,
                          "SCRAPPER_KB_DIR": self.knowledge_base_dir,
                          "SCRAPPER_WEB_DIR": self.web_dir,
                          "ADMIN_DASHBOARD_TOKEN": self.admin_dashboard_token,
                          "RISK_SCORER_V2_ACTIVE": self.risk_scorer_v2_active,
                          "REQUIRE_PERSISTENT_STORAGE": self.require_persistent_storage,
                          "SCRAPPER_STORAGE_PERSISTENT": self.storage_persistent_hint,
                          "RENDER_ENVIRONMENT": self.render_environment,
                          "GEMINI_PRIMARY_API_KEY": self.gemini_primary_api_key,
                          "GEMINI_BACKUP_API_KEY": self.gemini_backup_api_key,
                          "GEMINI_SECOND_BACKUP_API_KEY": self.gemini_second_backup_api_key,
                          "GROK_API_KEY": self.grok_api_key,
                          "OPENROUTER_API_KEY": self.openrouter_api_key,
                      }
              ''',
          )

          write(
              "scrapper_demo/storage/runtime.py",
              r'''
              """Runtime durability and writeability checks for analysis storage."""

              from __future__ import annotations

              import os
              import shutil
              import tempfile
              import uuid
              from dataclasses import dataclass
              from pathlib import Path


              RUNTIME_STORAGE_KEY = "checkniauto.runtime_storage"


              def _inside(path: Path, root: Path) -> bool:
                  try:
                      return os.path.commonpath([str(path), str(root)]) == str(root)
                  except ValueError:
                      return False


              @dataclass(frozen=True, slots=True)
              class RuntimeStorageStatus:
                  data_dir: str
                  jobs_dir: str
                  writable: bool
                  persistent: bool
                  required: bool
                  classification: str
                  free_bytes: int | None
                  message: str
                  probe_error: str = ""

                  @property
                  def ready(self) -> bool:
                      return self.writable and (self.persistent or not self.required)

                  def as_dict(self) -> dict[str, object]:
                      return {
                          "ready": self.ready,
                          "writable": self.writable,
                          "persistent": self.persistent,
                          "required": self.required,
                          "classification": self.classification,
                          "data_dir": self.data_dir,
                          "jobs_dir": self.jobs_dir,
                          "free_bytes": self.free_bytes,
                          "message": self.message,
                          "probe_error": self.probe_error,
                      }


              def inspect_runtime_storage(
                  data_dir: str | os.PathLike[str],
                  jobs_dir: str | os.PathLike[str],
                  *,
                  persistent_required: bool = False,
                  persistent_hint: bool = False,
                  render_environment: bool = False,
                  temp_root: str | os.PathLike[str] | None = None,
              ) -> RuntimeStorageStatus:
                  """Inspect the exact paths used for reports, images and token telemetry.

                  Render's normal filesystem is ephemeral. A production deployment must
                  both place ``SCRAPPER_DATA_DIR`` on the mounted disk and set
                  ``SCRAPPER_STORAGE_PERSISTENT=true``. The explicit hint prevents a
                  writable-but-ephemeral directory from being mistaken for durable storage.
                  """

                  data_path = Path(data_dir).expanduser().resolve()
                  jobs_path = Path(jobs_dir).expanduser().resolve()
                  temp_path = Path(temp_root or tempfile.gettempdir()).expanduser().resolve()
                  writable = False
                  probe_error = ""
                  free_bytes: int | None = None

                  try:
                      data_path.mkdir(parents=True, exist_ok=True)
                      jobs_path.mkdir(parents=True, exist_ok=True)
                      probe = data_path / f".checkniauto-storage-probe-{uuid.uuid4().hex}"
                      with probe.open("w", encoding="utf-8") as handle:
                          handle.write("ok")
                          handle.flush()
                          os.fsync(handle.fileno())
                      probe.unlink()
                      writable = True
                      free_bytes = int(shutil.disk_usage(data_path).free)
                  except OSError as exc:
                      probe_error = f"{type(exc).__name__}: {exc}"

                  if persistent_hint:
                      persistent = True
                      classification = "configured_persistent"
                  elif render_environment:
                      persistent = False
                      classification = "render_ephemeral_or_unverified"
                  elif _inside(jobs_path, temp_path) or _inside(data_path, temp_path):
                      persistent = False
                      classification = "temporary_directory"
                  else:
                      persistent = True
                      classification = "local_filesystem"

                  if not writable:
                      message = "Storage is not writable; no analysis can be safely saved."
                  elif persistent:
                      message = "Analysis reports, photos and token telemetry use persistent storage."
                  elif persistent_required:
                      message = (
                          "Persistent storage is required but not configured; analysis submission is blocked."
                      )
                  elif render_environment:
                      message = (
                          "Render storage is ephemeral or unverified; reports and token history can disappear "
                          "after a restart or deploy."
                      )
                  else:
                      message = (
                          "Storage is writable but temporary; suitable for tests, not paid analyses."
                      )

                  return RuntimeStorageStatus(
                      data_dir=str(data_path),
                      jobs_dir=str(jobs_path),
                      writable=writable,
                      persistent=persistent,
                      required=bool(persistent_required),
                      classification=classification,
                      free_bytes=free_bytes,
                      message=message,
                      probe_error=probe_error,
                  )
              ''',
          )

          write(
              "scrapper_demo/app.py",
              r'''
              """Flask application factory and mode-aware blueprint registration."""

              from __future__ import annotations

              import importlib
              import os
              from collections.abc import Mapping
              from pathlib import Path
              from typing import Any

              from flask import Flask, jsonify, request

              from .config import DemoServerConfig
              from .progress import RUNTIME_STATE_KEY, DemoRuntimeState
              from .routes import create_private_blueprint, create_public_blueprint
              from .routes._registration import register_app_request_hooks
              from .storage.runtime import (
                  RUNTIME_STORAGE_KEY,
                  RuntimeStorageStatus,
                  inspect_runtime_storage,
              )


              def _apply_config_overrides(app: Flask, overrides: Mapping[str, Any]) -> None:
                  app.config.update(overrides)
                  if "SCRAPPER_DATA_DIR" in overrides and "SCRAPPER_AUTA_DIR" not in overrides:
                      app.config["SCRAPPER_AUTA_DIR"] = os.path.join(
                          str(app.config["SCRAPPER_DATA_DIR"]), "Auta"
                      )
                  if "DEMO_MAX_UPLOAD_MB" in overrides and "MAX_CONTENT_LENGTH" not in overrides:
                      app.config["MAX_CONTENT_LENGTH"] = (
                          int(app.config["DEMO_MAX_UPLOAD_MB"]) * 1024 * 1024
                      )


              def _install_storage_guard(app: Flask, status: RuntimeStorageStatus) -> None:
                  app.extensions[RUNTIME_STORAGE_KEY] = status

                  def runtime_storage_guard():
                      if request.path.rstrip("/") == "/healthz":
                          payload = {
                              "status": "ok" if status.ready else "degraded",
                              "demo_mode": bool(app.config["DEMO_MODE"]),
                              "storage": status.as_dict(),
                          }
                          return jsonify(payload), 200 if status.ready else 503

                      guarded_paths = {"/api/demo/analyze", "/api/demo/analyze-manual"}
                      if (
                          request.method == "POST"
                          and request.path.rstrip("/") in guarded_paths
                          and not status.ready
                      ):
                          return (
                              jsonify(
                                  {
                                      "error": (
                                          "Analýza je dočasne nedostupná, pretože úložisko "
                                          "výsledkov nie je trvalé. Analýza nebola spustená "
                                          "ani spoplatnená."
                                      ),
                                      "code": "persistent_storage_unavailable",
                                      "storage": status.as_dict(),
                                  }
                              ),
                              503,
                          )
                      return None

                  runtime_storage_guard._checkniauto_request_local_hook = True  # type: ignore[attr-defined]
                  app.before_request(runtime_storage_guard)


              def create_app(
                  config: Mapping[str, Any] | None = None,
                  *,
                  register_legacy_routes: bool = True,
                  import_name: str | None = None,
              ) -> Flask:
                  """Create an independently configured Flask application instance."""
                  script_dir = Path(__file__).resolve().parent.parent
                  server_config = DemoServerConfig.from_env(script_dir)
                  static_folder = (
                      str(config["SCRAPPER_WEB_DIR"])
                      if config and "SCRAPPER_WEB_DIR" in config
                      else server_config.web_dir
                  )
                  app = Flask(
                      import_name or __name__,
                      static_folder=static_folder,
                      static_url_path="",
                  )
                  app.config.from_mapping(server_config.as_flask_mapping())
                  if config:
                      _apply_config_overrides(app, config)

                  storage_status = inspect_runtime_storage(
                      str(app.config["SCRAPPER_DATA_DIR"]),
                      str(app.config["SCRAPPER_AUTA_DIR"]),
                      persistent_required=bool(app.config["REQUIRE_PERSISTENT_STORAGE"]),
                      persistent_hint=bool(app.config["SCRAPPER_STORAGE_PERSISTENT"]),
                      render_environment=bool(app.config["RENDER_ENVIRONMENT"]),
                  )
                  _install_storage_guard(app, storage_status)
                  app.extensions[RUNTIME_STATE_KEY] = DemoRuntimeState(
                      int(app.config["DEMO_MAX_CONCURRENT_JOBS"])
                  )

                  if register_legacy_routes:
                      legacy_server = importlib.import_module("web_server")
                      handlers = vars(legacy_server)
                      app.register_blueprint(create_public_blueprint(handlers))
                      if not app.config["DEMO_MODE"]:
                          app.register_blueprint(create_private_blueprint(handlers))
                      register_app_request_hooks(legacy_server.app, app)

                  return app
              ''',
          )

          replace_once(
              "scrapper_demo/routes/_registration.py",
              """    for function in source.before_request_funcs.get(None, ()):\n        target.before_request(function)\n""",
              """    for function in source.before_request_funcs.get(None, ()):\n        if getattr(function, \"_checkniauto_request_local_hook\", False):\n            continue\n        target.before_request(function)\n""",
          )

          replace_once(
              "scrapper_demo/storage/listing_jobs.py",
              """    def cleanup_expired(self, ttl_minutes: int, *, now: float | None = None) -> list[str]:\n        cutoff = (time.time() if now is None else now) - (int(ttl_minutes) * 60)\n""",
              """    def cleanup_expired(self, ttl_minutes: int, *, now: float | None = None) -> list[str]:\n        ttl_minutes = int(ttl_minutes)\n        if ttl_minutes <= 0:\n            return []\n        cutoff = (time.time() if now is None else now) - (ttl_minutes * 60)\n""",
          )

          replace_between(
              "Bazos.py",
              "def _bazos_mileage_km(value):",
              "\n\ndef _advertised_drivetrain",
              r'''
              def _bazos_mileage_km(value):
                  """Choose the current odometer reading, not a service-history mileage."""
                  text = str(value or "").replace("\u00a0", " ")
                  folded = _fold_text(text)
                  candidates = {}

                  number_pattern = (
                      r"(?:\d{2,3}\s*(?:tis(?:\.|ic)?\.?|x{3}|\.{2,3})"
                      r"|\d{1,3}(?:[\s.]\d{3}){1,2}|\d{5,7})"
                  )
                  current_marker = re.compile(
                      r"(?:aktualn\w*\s+)?(?:najazd\w*|stav\s+(?:tachometra|km)|"
                      r"celkov\w*\s+najazd|mileage)\W{0,24}$",
                      re.IGNORECASE,
                  )
                  trailing_current_marker = re.compile(
                      r"^\W{0,16}(?:km|kilometrov?)?\W{0,16}"
                      r"(?:aktualn\w*|momentaln\w*|teraz|sucasn\w*)\b",
                      re.IGNORECASE,
                  )
                  service_marker = re.compile(
                      r"\b(?:lpg|autoplyn|plyn\w*\s+nadrz|montovan\w*|menen\w*|"
                      r"vymen\w*|servis\w*|opraven\w*|repas\w*|rozvod\w*|"
                      r"spojk\w*|olej\w*|prevodovk\w*|turbo\w*|brzd\w*|"
                      r"tlmic\w*|stk|ek)\b",
                      re.IGNORECASE,
                  )
                  interval_marker = re.compile(
                      r"(?:kazd\w*|interval\w*|po\s+kazd\w*)\W{0,18}$",
                      re.IGNORECASE,
                  )

                  def parse_km(raw_value):
                      folded_value = _fold_text(raw_value).strip()
                      first_number = re.search(r"\d{2,3}", folded_value)
                      if (
                          "tis" in folded_value
                          or "xxx" in folded_value
                          or re.fullmatch(r"\d{2,3}\s*\.{2,3}", folded_value)
                      ):
                          return int(first_number.group(0)) * 1000 if first_number else None
                      digits = re.sub(r"\D", "", folded_value)
                      return int(digits) if digits else None

                  def add_candidate(match, *, base_score, group="number"):
                      raw_value = match.group(group)
                      km = parse_km(raw_value)
                      if km is None or not 1_000 <= km <= 2_000_000:
                          return
                      start, end = match.span(group)
                      left = folded[max(0, start - 140):start]
                      right = folded[end:min(len(folded), end + 110)]
                      close_left = left[-80:]
                      score = int(base_score)

                      if current_marker.search(close_left):
                          score += 180
                      if trailing_current_marker.search(right[:70]):
                          score += 100

                      connector_left = re.search(
                          r"\b(?:pri|od|ked|v\s+case)\W{0,18}$",
                          close_left,
                          re.IGNORECASE,
                      )
                      connector_right = re.match(
                          r"^\W{0,16}(?:km|kilometrov?)?\W{0,10}"
                          r"(?:pri|od|v\s+case)\b",
                          right[:60],
                          re.IGNORECASE,
                      )
                      if (
                          connector_left
                          and (service_marker.search(left) or service_marker.search(right[:90]))
                      ) or (
                          connector_right and service_marker.search(right[:100])
                      ):
                          score -= 240

                      if interval_marker.search(close_left) or re.match(
                          r"^\W{0,15}(?:km\W*)?(?:interval\w*|kazd\w*)\b",
                          right[:65],
                          re.IGNORECASE,
                      ):
                          score -= 220

                      key = (start, end, km)
                      candidate = (score, km, start)
                      previous = candidates.get(key)
                      if previous is None or candidate > previous:
                          candidates[key] = candidate

                  labelled_pattern = re.compile(
                      rf"(?:aktualn\w*\s+)?(?:najazd\w*|stav\s+(?:tachometra|km)|"
                      rf"celkov\w*\s+najazd|mileage)\s*(?:je|:|-)?\s*"
                      rf"(?P<number>{number_pattern})\s*(?:km|kilometrov?)?",
                      re.IGNORECASE,
                  )
                  for match in labelled_pattern.finditer(folded):
                      add_candidate(match, base_score=70)

                  patterns = (
                      (rf"(?P<number>\d{{2,3}}\s*tis(?:\.|ic)?\s*\.?\s*)km\b", 38),
                      (rf"(?P<number>\d{{2,3}}\s*x{{3}})\s*(?:km|kilometrov?)\b", 36),
                      (rf"(?P<number>\d{{2,3}}\s*\.{{2,3}})(?!\d)", 32),
                      (rf"(?P<number>\d{{2,3}}(?:[\s.]\d{{3}})+)\s*km\b", 30),
                      (rf"(?P<number>\d{{5,7}})\s*km\b", 28),
                  )
                  for pattern, base_score in patterns:
                      for match in re.finditer(pattern, folded, re.IGNORECASE):
                          add_candidate(match, base_score=base_score)

                  if not candidates:
                      return None
                  _score, mileage_km, _position = max(candidates.values())
                  return mileage_km
              ''',
          )

          replace_once(
              "Bazos.py",
              """    if year_match:\n        info[\"parameters\"][\"Year\"] = year_match.group(1)\n""",
              """    if year_match:\n        info[\"parameters\"][\"Year\"] = year_match.group(1)\n    else:\n        title_year = re.search(r'\\b((?:19|20)\\d{2})\\b', info.get(\"title\", \"\"))\n        if title_year and 1980 <= int(title_year.group(1)) <= 2035:\n            info[\"parameters\"][\"Year\"] = title_year.group(1)\n""",
          )

