              TRUE_VALUES = {"1", "true", "yes", "on"}


              def _as_bool(value: str | None, default: bool) -> bool:
                  if value is None:
                      return default
                  return value.strip().lower() in TRUE_VALUES


              def _as_int(
                  values: Mapping[str, str],
                  name: str,
                  default: int,
