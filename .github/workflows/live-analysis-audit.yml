name: Apply V2 durability and listing-facts fix

on:
  push:
    branches: [tmp-auth-audit-20260904]
    paths:
      - ".github/workflows/live-analysis-audit.yml"

permissions:
  contents: write

jobs:
  patch-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply durability, mileage and observability update
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(dedent(content).lstrip("\n"), encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one occurrence in {path}, found {count}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_between(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              target.write_text(
                  text[:start] + dedent(replacement).lstrip("\n") + text[end:],
                  encoding="utf-8",
              )

          write(
              "scrapper_demo/config.py",
              r'''
